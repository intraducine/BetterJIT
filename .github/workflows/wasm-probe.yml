name: Manual private source checks
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-checks:
    if: github.event.repository.private && github.repository_owner == 'intraducine' && github.actor == 'intraducine'
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: bash scripts/check.sh
# Local experiments are the default. This optional workflow uploads nothing.
