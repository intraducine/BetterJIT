name: Manual research source checks
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-checks:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: bash scripts/check.sh
      - run: bash scripts/check-addon.sh
# Dispatch requires repository permissions; no hard-coded user or visibility gate.
# Local experiments remain the default. This workflow uploads nothing.
