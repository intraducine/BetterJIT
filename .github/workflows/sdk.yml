name: Runtime SDK checks
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sdk:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: bash scripts/check-sdk.sh
      - name: Current browser API execution
        run: |
          python3 -m venv .build/browser-venv
          .build/browser-venv/bin/pip install playwright==1.57.0
          .build/browser-venv/bin/python -m playwright install chromium
          .build/browser-venv/bin/python tests/sdk/browser-sdk.py --research-fixtures
      - name: Compile standalone iOS host without signing
        run: |
          brew install xcodegen
          cd Examples/MinimalHost
          xcodegen generate
          xcodebuild -project BetterJITExample.xcodeproj -scheme BetterJITExample -configuration Release -destination 'generic/platform=iOS' CODE_SIGNING_ALLOWED=NO build
# No artifact uploads, releases, automatic builds or personal account restrictions.
