name: One iPhone device session
on:
  push:
    branches: [feature/one-device-session, feature/packaged-backend, experimental/sparse-guest-backing]
    paths:
      - 'Sources/**'
      - 'Examples/**'
      - 'Backends/**'
      - 'fexwasm/**'
      - 'patches/**'
      - 'scripts/**'
      - 'tests/**'
      - 'Tests/**'
      - 'distribution/**'
      - 'Package.swift'
      - '.github/workflows/device-session.yml'
  workflow_dispatch:
    inputs:
      rebuild_assets:
        description: Rebuild all prepared inputs and native components instead of restoring assets
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: betterjit-device-session-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/experimental/sparse-guest-backing' }}
jobs:
  linux-fixture:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Execute the bundled Linux workload directly (not FEX/device evidence)
        run: python3 tests/fexhost/linux-session-native.py
      - name: Compile the experimental C command with the ordinary Linux toolchain
        if: github.ref == 'refs/heads/experimental/sparse-guest-backing'
        run: |
          python3 Examples/FEXHost/Guest/build-sparse-rot13.py --output .build/sparse-compiled-input/sparse-rot13-fresh.json --native-check
          python3 Examples/FEXHost/Guest/build-sparse-cat.py --output .build/sparse-compiled-input/sparse-cat-fresh.json --native-check
          python3 Examples/FEXHost/Guest/build-sparse-pipeline.py --output .build/sparse-compiled-input/sparse-pipeline-fresh.json --native-check
      - name: Transfer the fresh compiler output to Apple validation
        if: github.ref == 'refs/heads/experimental/sparse-guest-backing'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Sparse-compiled-input-${{ github.sha }}
          path: .build/sparse-compiled-input/*.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
      - name: Fingerprint the Wine input recipe
        id: wine-key
        run: python3 scripts/build-assets.py identity wine-inputs
      - name: Restore a compatible Wine input snapshot
        id: wine-cache
        if: inputs.rebuild_assets != true
        continue-on-error: true
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: .build/wine-input-assets
          key: ${{ steps.wine-key.outputs.key }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: ${{ steps.wine-key.outputs.key }}-
      - name: Validate Wine snapshot provenance and payload
        id: wine-asset
        run: python3 scripts/build-assets.py check wine-inputs ${{ inputs.rebuild_assets && '--bypass' || '' }}
      - name: Unpack the verified Wine snapshot into fresh staging
        if: steps.wine-asset.outputs.hit == 'true'
        run: python3 scripts/build-assets.py unpack-wine wine-inputs
      - name: Prepare signed stock Alpine Wine inputs for the app
        id: wine-root
        if: steps.wine-asset.outputs.hit != 'true'
        continue-on-error: true
        run: |
          python3 scripts/prepare-wine-root.py
      - name: Build separate Wine Win64 input for the flat guest window
        id: wine-flat
        if: steps.wine-asset.outputs.hit != 'true' && steps.wine-root.outcome == 'success'
        continue-on-error: true
        run: |
          git clone --depth 1 --branch wine-10.7 --no-checkout https://github.com/wine-mirror/wine.git .build/wine-flat-source
          git -C .build/wine-flat-source checkout --detach 71c6c3dd6dcfffc040aa5a10a825eeb8e17f6299
          python3 scripts/prepare-wine-flat-root.py --source .build/wine-flat-source
      - name: Seal the completed Wine snapshot with matching source evidence
        id: seal-wine
        if: steps.wine-flat.outcome == 'success'
        continue-on-error: true
        run: |
          python3 scripts/build-assets.py pack-wine wine-inputs
          python3 scripts/build-assets.py seal wine-inputs --producer-outcome '${{ steps.wine-flat.outcome }}'
      - name: Preserve the verified Wine snapshot
        if: steps.seal-wine.outputs.sealed == 'true'
        continue-on-error: true
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: .build/wine-input-assets
          key: ${{ steps.wine-key.outputs.key }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Pack stock root and any completed source-built Wine input
        if: steps.wine-asset.outputs.hit == 'true' || steps.wine-root.outcome == 'success'
        run: |
          tar -czf .build/bundled-wine-root.tar.gz -C .build device-linuxroot
      - name: Retain Wine source and preparation evidence
        if: always() && hashFiles('.build/wine-flat-build/build.log') != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: wine-flat-source-and-build-${{ github.sha }}
          path: .build/wine-flat-build/
          retention-days: 14
      - name: Transfer prepared Wine root to the Apple build
        if: steps.wine-asset.outputs.hit == 'true' || steps.wine-root.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: bundled-wine-root-${{ github.sha }}
          path: |
            .build/bundled-wine-root.tar.gz
            .build/asset-usage/wine-inputs.json
          retention-days: 7
  iphone-app:
    needs: linux-fixture
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Install tools
        run: brew install cmake ninja xcodegen
      - name: Fingerprint native FEX inputs and selected Apple tools
        id: native-key
        run: python3 scripts/build-assets.py identity fex-ios
      - name: Fingerprint host translator inputs and selected Apple tools
        id: host-key
        run: python3 scripts/build-assets.py identity fex-host
      - name: Validate SDK and complete device-session orchestration
        run: |
          bash scripts/check-sdk.sh
          bash scripts/check-fexhost.sh
          swift test -j 2 --filter AppleHostTests
          python3 scripts/export-sdk.py --check
      - name: Fetch the prepared Wine input candidate
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: bundled-wine-root-${{ github.sha }}
          path: .build
      - name: Unpack the bundled root
        if: hashFiles('.build/bundled-wine-root.tar.gz') != ''
        run: |
          python3 scripts/build-assets.py unpack-root wine-inputs
          mkdir -p .build/asset-usage
      - name: Restore native FEX build
        id: fex-cache
        if: inputs.rebuild_assets != true
        continue-on-error: true
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: .build/FEXNativePackage
          key: ${{ steps.native-key.outputs.key }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: ${{ steps.native-key.outputs.key }}-
      - name: Validate native FEX provenance and output hashes
        id: native-asset
        run: python3 scripts/build-assets.py check fex-ios ${{ inputs.rebuild_assets && '--bypass' || '' }}
      - name: Build native FEX for the app
        id: build-native
        if: steps.native-asset.outputs.hit != 'true'
        run: |
          set -o pipefail
          bash Backends/FEX/build-ios.sh 2>&1 | tee .build/native-fex-build.log
      - name: Seal the successful native FEX package
        id: seal-native
        if: steps.build-native.outcome == 'success'
        run: python3 scripts/build-assets.py seal fex-ios --producer-outcome '${{ steps.build-native.outcome }}'
      - name: Preserve reusable native FEX build
        if: steps.seal-native.outputs.sealed == 'true'
        continue-on-error: true
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: .build/FEXNativePackage
          key: ${{ steps.native-key.outputs.key }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Record reused native build
        if: steps.native-asset.outputs.hit == 'true'
        run: printf '%s\n' 'Reused verified native FEX asset; exact producer and input/output hashes are in asset-usage/fex-ios.json.' > .build/native-fex-build.log
      - name: Package the consumer adapter around the native backend
        run: python3 scripts/package-fex-adapter.py
      - name: Restore host translator
        id: host-cache
        if: inputs.rebuild_assets != true
        continue-on-error: true
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: .build/host-fex
          key: ${{ steps.host-key.outputs.key }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: ${{ steps.host-key.outputs.key }}-
      - name: Validate host translator provenance and output hashes
        id: host-asset
        run: python3 scripts/build-assets.py check fex-host ${{ inputs.rebuild_assets && '--bypass' || '' }}
      - name: Build the live host translator
        id: build-host
        if: steps.host-asset.outputs.hit != 'true'
        run: |
          set -o pipefail
          bash Backends/FEX/build-host.sh 2>&1 | tee .build/host-fex-build.log
      - name: Seal the successful host translator
        id: seal-host
        if: steps.build-host.outcome == 'success'
        run: python3 scripts/build-assets.py seal fex-host --producer-outcome '${{ steps.build-host.outcome }}'
      - name: Preserve reusable host translator
        if: steps.seal-host.outputs.sealed == 'true'
        continue-on-error: true
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: .build/host-fex
          key: ${{ steps.host-key.outputs.key }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Fetch the ordinary compiler output
        if: github.ref == 'refs/heads/experimental/sparse-guest-backing'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: Sparse-compiled-input-${{ github.sha }}
          path: .build/sparse-compiled-input
      - name: Validate experimental sparse steps with the fresh Apple host translator
        if: github.ref == 'refs/heads/experimental/sparse-guest-backing'
        run: |
          node tests/sdk/linux-host/sparse-live.cjs .build/host-fex/fexserve .build/sparse-live-results.json
          node tests/sdk/linux-host/sparse-scalars.cjs .build/host-fex/fexserve .build/sparse-scalar-results.json
          node tests/sdk/linux-host/sparse-sync.cjs .build/host-fex/fexserve .build/sparse-sync-results.json
          node tests/sdk/linux-host/sparse-clone.cjs .build/host-fex/fexserve .build/sparse-clone-results.json
          node tests/sdk/linux-host/sparse-flow.cjs .build/host-fex/fexserve .build/sparse-flow-results.json
          node tests/sdk/linux-host/sparse-fork.cjs .build/host-fex/fexserve .build/sparse-fork-results.json
          node tests/sdk/linux-host/sparse-exec.cjs .build/host-fex/fexserve .build/sparse-exec-results.json
          node tests/sdk/linux-host/sparse-alu.cjs .build/host-fex/fexserve .build/sparse-alu-results.json
          node tests/sdk/linux-host/sparse-and.cjs .build/host-fex/fexserve .build/sparse-and-results.json
          node tests/sdk/linux-host/sparse-call.cjs .build/host-fex/fexserve .build/sparse-call-results.json
          node tests/sdk/linux-host/sparse-extend.cjs .build/host-fex/fexserve .build/sparse-extend-results.json
          node tests/sdk/linux-host/sparse-nop.cjs .build/host-fex/fexserve .build/sparse-nop-results.json
          node tests/sdk/linux-host/sparse-memory-add.cjs .build/host-fex/fexserve .build/sparse-memory-add-results.json
          .build/host-fex/sparse-memory-add-ir > .build/sparse-memory-add-ir-results.log
          node tests/sdk/linux-host/sparse-bootstrap-contract.cjs .build/host-fex/fexserve .build/sparse-bootstrap-contract-results.json
          node tests/sdk/linux-host/sparse-bootstrap-diagnostics.cjs .build/host-fex/fexserve .build/sparse-bootstrap-diagnostics-results.json
          node tests/sdk/linux-host/sparse-compiled.cjs .build/host-fex/fexserve .build/sparse-compiled-results.json
          node tests/sdk/linux-host/sparse-compiled.cjs .build/host-fex/fexserve .build/sparse-compiled-fresh-results.json .build/sparse-compiled-input/sparse-rot13-fresh.json
          node tests/sdk/linux-host/sparse-cat.cjs .build/host-fex/fexserve .build/sparse-cat-results.json
          node tests/sdk/linux-host/sparse-cat.cjs .build/host-fex/fexserve .build/sparse-cat-fresh-results.json .build/sparse-compiled-input/sparse-cat-fresh.json
          node tests/sdk/linux-host/sparse-pipeline.cjs .build/host-fex/fexserve .build/sparse-pipeline-results.json
          node tests/sdk/linux-host/sparse-pipeline.cjs .build/host-fex/fexserve .build/sparse-pipeline-fresh-results.json .build/sparse-compiled-input/sparse-pipeline-fresh.json
      - name: Probe the actual adapted Wine interpreter through sparse FEX/Wasm
        if: github.ref == 'refs/heads/experimental/sparse-guest-backing'
        run: |
          node tests/sdk/linux-host/sparse-linux-bootstrap.cjs .build/host-fex/fexserve .build/sparse-call-bootstrap-results.json --synthetic-calls
          node tests/sdk/linux-host/sparse-linux-bootstrap.cjs .build/host-fex/fexserve .build/sparse-extend-bootstrap-results.json --synthetic-extensions
          node tests/sdk/linux-host/sparse-linux-bootstrap.cjs .build/host-fex/fexserve .build/sparse-nop-bootstrap-results.json --synthetic-nops
          node tests/sdk/linux-host/sparse-linux-bootstrap.cjs .build/host-fex/fexserve .build/sparse-wine-bootstrap-results.json .build/device-linuxroot
      - name: Execute the compiled command in real macOS WebKit
        if: github.ref == 'refs/heads/experimental/sparse-guest-backing'
        run: |
          set -o pipefail
          BETTERJIT_SPARSE_FEXSERVE="$PWD/.build/host-fex/fexserve" swift test -j 2 --filter SparseWebKitHostTests 2>&1 | tee .build/sparse-webkit-results.log
      - name: Preserve experimental host execution evidence
        if: always() && github.ref == 'refs/heads/experimental/sparse-guest-backing'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Sparse-host-validation-${{ github.sha }}
          path: |
            .build/sparse-live-results.json
            .build/sparse-scalar-results.json
            .build/sparse-sync-results.json
            .build/sparse-clone-results.json
            .build/sparse-flow-results.json
            .build/sparse-fork-results.json
            .build/sparse-exec-results.json
            .build/sparse-alu-results.json
            .build/sparse-and-results.json
            .build/sparse-call-results.json
            .build/sparse-call-bootstrap-results.json
            .build/sparse-extend-results.json
            .build/sparse-extend-bootstrap-results.json
            .build/sparse-nop-results.json
            .build/sparse-memory-add-results.json
            .build/sparse-memory-add-ir-results.log
            .build/sparse-nop-bootstrap-results.json
            .build/sparse-bootstrap-contract-results.json
            .build/sparse-bootstrap-diagnostics-results.json
            .build/sparse-compiled-results.json
            .build/sparse-compiled-fresh-results.json
            .build/sparse-cat-results.json
            .build/sparse-cat-fresh-results.json
            .build/sparse-pipeline-results.json
            .build/sparse-pipeline-fresh-results.json
            .build/sparse-wine-bootstrap-results.json
            .build/sparse-webkit-results.log
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
      - name: Execute real Linux userspace through live FEX and the promoted runtime
        id: live-linux
        env:
          BETTERJIT_REQUIRE_WINE_FLAT: '1'
        continue-on-error: true
        if: hashFiles('.build/device-linuxroot/.betterjit-linux-root.json') != ''
        run: |
          set -o pipefail
          node --experimental-wasm-jspi tests/sdk/live-linux.cjs .build/device-linuxroot .build/host-fex/fexserve .build/live-linux-results.json 2>&1 | tee .build/live-linux-build.log
      - name: Build the complete iPhone app
        run: |
          set -o pipefail
          python3 Examples/FEXHost/prepare.py
          xcodebuild -project Examples/FEXHost/BetterJITFEXHost.xcodeproj -scheme BetterJITFEXHost -configuration Release -destination 'generic/platform=iOS' -derivedDataPath .build/device-session CODE_SIGNING_ALLOWED=NO build 2>&1 | tee .build/device-session-build.log
      - name: Package and compile the consumer outside the checkout
        run: |
          set -o pipefail
          python3 scripts/package-fex-consumer.py --output "$RUNNER_TEMP/BetterJIT-Consumer-${GITHUB_SHA}"
          python3 "$RUNNER_TEMP/BetterJIT-Consumer-${GITHUB_SHA}/BetterJIT-SDK/Examples/FEXHost/prepare.py" --native-package "$RUNNER_TEMP/BetterJIT-Consumer-${GITHUB_SHA}/FEXNativePackage" --adapter-package "$RUNNER_TEMP/BetterJIT-Consumer-${GITHUB_SHA}/BetterJITFEXAdapter"
          xcodebuild -project "$RUNNER_TEMP/BetterJIT-Consumer-${GITHUB_SHA}/BetterJIT-SDK/Examples/FEXHost/BetterJITFEXHost.xcodeproj" -scheme BetterJITFEXHost -configuration Release -destination 'generic/platform=iOS' -derivedDataPath "$RUNNER_TEMP/consumer-validation" CODE_SIGNING_ALLOWED=NO build 2>&1 | tee .build/consumer-build.log
          tar -czf "$RUNNER_TEMP/BetterJIT-Consumer-${GITHUB_SHA}.tar.gz" -C "$RUNNER_TEMP" "BetterJIT-Consumer-${GITHUB_SHA}"
      - name: Upload the portable SDK and device backend
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: BetterJIT-Consumer-${{ github.sha }}
          path: |
            ${{ runner.temp }}/BetterJIT-Consumer-${{ github.sha }}.tar.gz
            .build/consumer-build.log
          if-no-files-found: error
          retention-days: 14
      - name: Package unsigned app for the user's existing signing/install route
        env:
          LIVE_HOST_OUTCOME: ${{ steps.live-linux.outcome }}
        run: |
          mkdir -p .build/device-session-artifact/Payload
          cp -R .build/device-session/Build/Products/Release-iphoneos/BetterJITFEXHost.app .build/device-session-artifact/Payload/
          cp COPYING THIRD_PARTY.md .build/device-session-artifact/
          cp -R LICENSES .build/device-session-artifact/
          if test -f .build/device-linuxroot/.betterjit-linux-root.json; then
            cp .build/device-linuxroot/.betterjit-linux-root.json .build/device-session-artifact/WINE-ROOT-PROVENANCE.json
          else
            printf '%s\n' '{"bundled":false,"reason":"Wine input preparation was unavailable; use a staged root or report unsupported."}' > .build/device-session-artifact/WINE-ROOT-PROVENANCE.json
          fi
          cp Examples/FEXHost/DEVICE-SESSION.md .build/device-session-artifact/PHONE-INSTRUCTIONS.md
          cp .build/native-fex-build.log .build/device-session-build.log .build/device-session-artifact/
          cp -R .build/asset-usage .build/device-session-artifact/
          if test -f .build/live-linux-results.json; then cp .build/live-linux-results.json .build/device-session-artifact/LIVE-LINUX-RESULTS.json; fi
          if test -d .build/wine-instruction-trace; then cp -R .build/wine-instruction-trace .build/device-session-artifact/WINE-INSTRUCTION-TRACE; fi
          python3 - <<'PY'
          import hashlib, json, os, pathlib, subprocess
          root=pathlib.Path('.build/device-session-artifact')
          manifest={'repository':'intraducine/BetterJIT','commit':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),'signed':False,'deviceExecuted':False}
          manifest['liveHostValidation']=os.environ['LIVE_HOST_OUTCOME']
          manifest['buildAssets']={p.stem:json.loads(p.read_text()) for p in (root/'asset-usage').glob('*.json')}
          manifest['files']={str(p.relative_to(root)):hashlib.sha256(p.read_bytes()).hexdigest() for p in (root/'Payload').rglob('*') if p.is_file()}
          (root/'BUILD-MANIFEST.json').write_text(json.dumps(manifest,indent=2)+'\n')
          PY
          cd .build/device-session-artifact
          zip -qry BetterJIT-Device-Session-unsigned.ipa Payload
      - name: Upload app and exact build evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: BetterJIT-Device-Session-${{ github.sha }}
          path: |
            .build/device-session-artifact/BetterJIT-Device-Session-unsigned.ipa
            .build/device-session-artifact/BUILD-MANIFEST.json
            .build/device-session-artifact/WINE-ROOT-PROVENANCE.json
            .build/device-session-artifact/LIVE-LINUX-RESULTS.json
            .build/device-session-artifact/WINE-INSTRUCTION-TRACE/
            .build/device-session-artifact/PHONE-INSTRUCTIONS.md
            .build/device-session-artifact/COPYING
            .build/device-session-artifact/THIRD_PARTY.md
            .build/device-session-artifact/LICENSES/
            .build/device-session-artifact/*-build.log
            .build/device-session-artifact/asset-usage/
          if-no-files-found: error
          retention-days: 14
      - name: Retain a failing validation outcome after preserving the compiled app
        if: steps.live-linux.outcome != 'success'
        run: |
          echo 'Required live host validation failed or was unavailable. The unsigned app and available results are preserved; this run remains failed.'
          exit 1
      - name: Preserve failure logs
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Device-session-build-failure-${{ github.sha }}
          path: |
            .build/native-fex-build.log
            .build/host-fex-build.log
            .build/live-linux-build.log
            .build/live-linux-results.json
            .build/wine-instruction-trace/
            .build/device-session-build.log
            .build/consumer-build.log
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7
# Builds are unsigned. No secrets, automatic signing, merge, release or device claim.
