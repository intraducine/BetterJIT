name: Probe tests and unsigned iOS build
on:
  push:
    branches: [main, 'prototype/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: probe-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Swift core tests
        run: swift test
      - name: Independent UDP wire test
        run: python3 scripts/wire_smoke.py
      - name: Assigned-interface IPv4 and IPv6 wire tests
        run: python3 scripts/interface_wire_smoke.py
      - name: Install project generator
        run: brew install xcodegen
      - name: Build unsigned iOS app
        run: bash scripts/build-ios.sh
      - uses: actions/upload-artifact@v4
        with:
          name: BetterJIT-unsigned
          path: build/BetterJIT-unsigned.ipa
          if-no-files-found: error
      - name: Archive exact source
        run: git archive --format=zip --prefix=BetterJIT/ HEAD > build/BetterJIT-source.zip
      - uses: actions/upload-artifact@v4
        with:
          name: BetterJIT-source
          path: build/BetterJIT-source.zip
          if-no-files-found: error
